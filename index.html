<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control de Asistencias</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <h2>📋 Asistencias (<span id="total-count">0</span>)</h2>

    <div class="input-box">
      <input type="text" id="name-input" placeholder="Nombre del practicante...">
      <button id="add-btn">Registrar</button>
    </div>

    <ul id="attendance-list"></ul>

    <button id="clear-btn" class="clear-btn">Limpiar Lista</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
